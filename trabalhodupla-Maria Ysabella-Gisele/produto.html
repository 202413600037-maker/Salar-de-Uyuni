<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="imgs/icon.svg">

    <title>Salar de Uyuni</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/produto.css">
</head>
<body>
<header>

    <div class="logo">
        <a href="index.html">

            <img src="imgs/logo.svg" alt="Logo">
        </a>
    </div>


    <nav>
        <a href="index.html">Home</a>
        <a href="produto2.html">Produtos</a>
        <a href="login.html">Conta</a>
        <a href="carrinho.html" class="cart-link">
            <i class="ri-shopping-cart-2-fill"></i>
            <span class="cart-count" id="cart-count">
                0
            </span>
        </a>
    </nav>

</header>

<div class="produto-container">
    <div class="produto-img">
        <img id="prod-img" src="" alt="Produto">
    </div>
    <div class="produto-info">
        <a href="index.html" class="voltar"><i class="ri-arrow-left-line"></i> Voltar</a>
        <h1 id="prod-nome"></h1>
        <p class="descricao" id="prod-desc"></p>
        <div class="preco" id="prod-preco"></div>
        <div class="preco-parcelado" id="prod-parcelado"></div>
        <div class="quantidade-wrapper">
            <span>Quantidade:</span>
            <div class="quantidade">
                <button type="button" id="btn-qtd-menos">−</button>
                <input type="number" id="qtd" value="1" min="1" max="99" readonly>
                <button type="button" id="btn-qtd-mais">+</button>
            </div>
        </div>
        <div class="btns">
            <button class="btn-carrinho" id="btn-adicionar">
                <i class="ri-shopping-cart-2-line"></i> Adicionar ao Carrinho
            </button>
            <button class="btn-comprar" id="btn-comprar">
                <i class="ri-secure-payment-line"></i> Comprar Agora
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/carrinho-store.js"></script>
<script src="js/produto.js"></script>
</body>
</html>
