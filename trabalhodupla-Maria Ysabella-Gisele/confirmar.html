<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="imgs/icon.svg">
    <title>Confirmar Compra </title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/confirmar.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><img src="imgs/logo.svg" alt="Logo"></a>
    
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="carrinho.html"><i class="ri-shopping-cart-2-fill"></i></a>
    </nav>
</header>

<div class="confirmar-container">
    <div class="confirmar-card">
        <h1><i class="ri-secure-payment-line"></i> Confirmar Compra</h1>

        
        <div class="secao">
            <h2><i class="ri-user-line"></i> Seus Dados</h2>
            <div id="dados-usuario"><p>Carregando...</p></div>
        </div>

  
        <div class="secao">
            <h2><i class="ri-shopping-bag-line"></i> Itens do Pedido</h2>
            <div id="itens-pedido"></div>
        </div>

      
        <div class="secao">
            <h2><i class="ri-qr-code-line"></i> Pagamento via PIX</h2>

            <div class="qrcode-box">
                <img src="imgs/BFC_QR_CODE-300x300-2467813855.png" alt="QR Code PIX" class="qrcode-img">

                <p>Escaneie o QR Code e pague via PIX</p>
                <p>Após pagar, clique em <strong>Confirmar Compra</strong></p>
            </div>
        </div>

       
        <div class="total-linha">
            <span>Total:</span>
            <span id="total-pedido" class="total-valor">R$ 0,00</span>
        </div>

        <button type="button" id="btn-confirmar" class="btn-confirmar">
            <i class="ri-check-double-line"></i> Confirmar Compra
        </button>

        <a href="carrinho.html" class="btn-voltar">
            <i class="ri-arrow-left-line"></i> Voltar ao Carrinho
        </a>
    </div>


    <div class="modal-overlay hidden" id="modal-sucesso">
        <div class="modal">
            <div class="modal-icone">✅</div>
            <h2>Pedido Realizado!</h2>
            <p>Número da venda: <strong id="numero-venda"></strong></p>
            <p>Obrigado por comprar!</p>
            <a href="index.html" class="btn-link">Voltar à loja</a>
        </div>
    </div>
</div>

    <script src="js/carrinho-store.js"></script>
    <script src="js/confirmar.js"></script>
</body>
</html>
