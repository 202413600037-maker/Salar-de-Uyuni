<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="imgs/icon.svg">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><img src="imgs/logo.svg" alt="Logo"></a>
        
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="form-container">
    <div class="form-card">

        <div class="etapas">
            <div class="etapa concluida"><i class="ri-check-line"></i></div>
            <div class="etapa-linha concluida"></div>
            <div class="etapa ativa">2</div>
        </div>

        <h1><i class="ri-shield-keyhole-line"></i> Dados de Acesso</h1>
        <p class="form-sub">Etapa 2 de 2 — Crie seu e-mail e senha de acesso</p>

        <div id="mensagem-status" class="mensagem-status"></div>

        <form action="php/cadastro.php" method="POST">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="input-senha">
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <button type="button" data-toggle-senha data-target="senha">Mostrar</button>
                </div>
            </div>

            <button type="submit" name="salvar2" class="btn-submit">
                <i class="ri-user-follow-line"></i> Finalizar Cadastro
            </button>
        </form>

        <div class="form-links">
            <p>Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>
</div>

<script src="js/forms.js"></script>
</body>
</html>
