<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="imgs/icon.svg">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html"><img src="imgs/logo.svg" alt="Logo"></a>
        
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<div class="form-container">
    <div class="form-card">

        <div class="etapas">
            <div class="etapa ativa">1</div>
            <div class="etapa-linha"></div>
            <div class="etapa">2</div>
        </div>

        <h1><i class="ri-user-add-line"></i> Dados Pessoais</h1>
        <p class="form-sub">Etapa 1 de 2 — Preencha seus dados pessoais</p>

        <div id="mensagem-status" class="mensagem-status"></div>

        <form action="php/cadastro.php" method="POST">
            <div class="campo">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" placeholder="Seu nome completo" required>
            </div>

            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" placeholder="00000000000" maxlength="14" required>
            </div>

            <div class="campo">
                <label for="cep">CEP</label>
                <div class="input-cep">
                    <input type="text" id="cep" name="cep" placeholder="00000000" maxlength="8" required>
                    <button type="button" id="buscar-cep">
                        <i class="ri-search-line"></i>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, número, complemento" required>
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" placeholder="Bairro" required>
                </div>
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Cidade" required>
                </div>
            </div>

            <div class="campo">
                <label for="estado">Estado (UF)</label>
                <input type="text" id="estado" name="estado" placeholder="Ex: BA" maxlength="2" required>
            </div>
<button type="submit" name="salvar1" class="btn-submit">
    Próxima etapa <i class="ri-arrow-right-line"></i>
</button>
        </form>

        <div class="form-links">
            <p>Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </div>
</div>

<script src="js/forms.js"></script>
</body>
</html>
